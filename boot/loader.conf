# Preload BOTH the small init ramdisk AND the big compressed rootfs as
# md devices, so neither depends on a filesystem mount surviving the
# forced vfs_unmountall() during reboot -r.

# md0 = mfsroot: small init ramdisk with our pivot script
mfs_load="YES"
mfs_type="mfs_root"
mfs_name="/boot/mfsroot"

# md1 = rootfs.uzip: the real root, compressed UFS image.
# geom_uzip auto-tastes /dev/md1 and produces /dev/md1.uzip.
rootfs_load="YES"
rootfs_type="md_image"
rootfs_name="/boot/rootfs.uzip"

# GEOM modules used by the pivot
geom_uzip_load="YES"
geom_union_load="YES"

# init runs our pivot script via the init_script kenv mechanism.
# /sbin/init in mfsroot is the real FreeBSD init binary; on startup it
# reads init_script and forks a child to run it. The script does the
# gunion setup and calls reboot -r, which signals init via SIGEMT to
# perform the proper two-phase reroot.
init_shell="/rescue/sh"
init_script="/init.sh"

# Initial root (mfsroot). reboot -r will replace this with the gunion union.
vfs.root.mountfrom="ufs:/dev/md0"

# Boot quietly to serial console so CI can scrape it
boot_serial="YES"
console="comconsole,vidconsole"
comconsole_speed="115200"
beastie_disable="YES"
autoboot_delay="2"
