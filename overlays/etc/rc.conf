# freebsd-livecd default rc.conf
hostname="livecd"
sshd_enable="NO"
ifconfig_DEFAULT="DHCP"
keymap="us.kbd"

# Don't try to remount root rw — gunion's UFS upper is already writable.
# (The line below is the FreeBSD default; left explicit for clarity.)
root_rw_mount="YES"

# Useful for first boot
clear_tmp_enable="YES"
syslogd_flags="-ss"
sendmail_enable="NONE"
dumpdev="NO"

# Run our smoke-test marker at the end of multi-user boot
local_startup="/etc/rc.d /usr/local/etc/rc.d"
